<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0F" />
    <title>Log in — Clicker</title>
    <script type="module" src="/src/pages/login.ts"></script>
  </head>
  <body>
    <header class="site-nav">
      <div class="container">
        <a href="/" class="nav-logo">Clicker<span class="dot">.</span></a>
        <div class="nav-links" data-nav-auth></div>
      </div>
    </header>

    <main>
      <div class="narrow container">
        <h1>Welcome back</h1>
        <p style="margin: 8px 0 24px">Log in to see your waitlist spot and beta status.</p>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%">Log in</button>
          <p class="form-footer">
            <a href="#" id="toggle-reset">Forgot your password?</a> ·
            <a href="/signup.html">Create an account</a>
          </p>
        </form>

        <form id="reset-request-form" hidden style="margin-top: 24px" novalidate>
          <div class="field">
            <label for="reset-email">Account email</label>
            <input id="reset-email" name="email" type="email" autocomplete="email" required />
          </div>
          <button type="submit" class="btn btn-secondary" style="width: 100%">Send reset link</button>
        </form>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <nav>
          <a href="/">Home</a>
          <a href="/privacy.html">Privacy</a>
          <a href="/terms.html">Terms</a>
        </nav>
        <p>© <span id="year">2026</span> Clicker. Built independently.</p>
        <p class="disclaimer">Not affiliated with or endorsed by Roku, Inc. Roku is a trademark of Roku, Inc.</p>
      </div>
    </footer>
  </body>
</html>
