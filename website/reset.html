<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0F" />
    <title>Reset password — Clicker</title>
    <script type="module" src="/src/pages/reset.ts"></script>
  </head>
  <body>
    <header class="site-nav">
      <div class="container">
        <a href="/" class="nav-logo">Clicker<span class="dot">.</span></a>
        <div class="nav-links" data-nav-auth></div>
      </div>
    </header>

    <main>
      <div class="narrow container">
        <h1>Set a new password</h1>
        <p style="margin: 8px 0 24px">Choose a new password for your account.</p>

        <form id="reset-form" novalidate>
          <div class="field">
            <label for="password">New password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required />
            <p class="hint">At least 10 characters.</p>
          </div>
          <div class="field">
            <label for="confirm">Confirm new password</label>
            <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="10" required />
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%">Update password</button>
        </form>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <nav>
          <a href="/">Home</a>
          <a href="/privacy.html">Privacy</a>
          <a href="/terms.html">Terms</a>
        </nav>
        <p>© <span id="year">2026</span> Clicker. Built independently.</p>
        <p class="disclaimer">Not affiliated with or endorsed by Roku, Inc. Roku is a trademark of Roku, Inc.</p>
      </div>
    </footer>
  </body>
</html>
