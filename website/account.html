<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0F" />
    <meta name="robots" content="noindex" />
    <title>Your account — Clicker</title>
    <script type="module" src="/src/pages/account.ts"></script>
  </head>
  <body>
    <header class="site-nav">
      <div class="container">
        <a href="/" class="nav-logo">Clicker<span class="dot">.</span></a>
        <div class="nav-links" data-nav-auth></div>
      </div>
    </header>

    <main>
      <div class="narrow container">
        <h1 id="greeting">Loading…</h1>
        <div class="card" style="margin-top: 24px">
          <span class="badge" id="beta-badge">…</span>
          <p id="waitlist-position" style="margin-top: 12px">Fetching your spot…</p>
          <a id="testflight-link" class="btn btn-primary" style="margin-top: 16px" hidden
             target="_blank" rel="noopener">Open TestFlight invite</a>
        </div>
        <p style="margin-top: 16px; font-size: 14px; color: var(--text-muted)">
          Invites go out in waves during beta. We'll email you when it's your turn.
        </p>
        <button type="button" id="logout-btn" class="btn btn-secondary btn-sm" style="margin-top: 24px">
          Log out
        </button>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <nav>
          <a href="/">Home</a>
          <a href="/privacy.html">Privacy</a>
          <a href="/terms.html">Terms</a>
        </nav>
        <p>© <span id="year">2026</span> Clicker. Built independently.</p>
        <p class="disclaimer">Not affiliated with or endorsed by Roku, Inc. Roku is a trademark of Roku, Inc.</p>
      </div>
    </footer>
  </body>
