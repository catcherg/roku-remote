name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rokukit:
    name: RokuKit build + test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        working-directory: RokuKit
        run: swift build
      - name: Test (with coverage)
        working-directory: RokuKit
        run: swift test --enable-code-coverage
      - name: Coverage report (DoD target ≥85% on RokuKit sources)
        working-directory: RokuKit
        run: |
          BIN=$(swift build --show-bin-path)
          XCTEST_BUNDLE=$(find "$BIN" -maxdepth 1 -name '*.xctest' | head -1)
          BINARY="$XCTEST_BUNDLE/Contents/MacOS/$(basename "$XCTEST_BUNDLE" .xctest)"
          xcrun llvm-cov report "$BINARY" \
            -instr-profile "$BIN/codecov/default.profdata" \
            -ignore-filename-regex "Tests|\.build" | tee coverage.txt
          TOTAL=$(grep '^TOTAL' coverage.txt | awk '{print $10}' | tr -d '%')
          echo "Line coverage: ${TOTAL}%"
          echo "### RokuKit line coverage: ${TOTAL}% (target ≥85%)" >> "$GITHUB_STEP_SUMMARY"

  app:
    name: App build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app target
        run: |
          if [ -d "App/Clicker.xcodeproj" ]; then
            xcodebuild build \
              -project App/Clicker.xcodeproj \
              -scheme Clicker \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO
          else
            echo "::notice::App/Clicker.xcodeproj not created yet — skipping app build (see App/XCODE_SETUP.md)."
          fi

  website:
    name: Website build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        working-directory: website
        run: npm ci
      - name: Build
        working-directory: website
        run: npm run build
