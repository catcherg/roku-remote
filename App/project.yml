name: Clicker
options:
  bundleIdPrefix: com.catchergriffin
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  RokuKit:
    path: ../RokuKit

targets:
  Clicker:
    type: application
    platform: iOS
    sources:
      - Clicker
    dependencies:
      - package: RokuKit
    info:
      path: Support/Info.plist
      properties:
        NSLocalNetworkUsageDescription: This app needs local network access to find and control Roku devices on your Wi-Fi.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.catchergriffin.clicker
        DEVELOPMENT_TEAM: YZSL25MTN9
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: "5.10"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # Unit tests for app-target logic (subscription / lifetime entitlements and
  # the free key presses). Hosted by the app so StoreKitTest can run real
  # purchases against Clicker.storekit.
  ClickerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ClickerTests
      # Local StoreKit products (weekly subscription with a 3-day free trial,
      # and the lifetime unlock). Bundled with the tests only; it never ships
      # inside the app.
      - path: Support/Clicker.storekit
        buildPhase: resources
    dependencies:
      - target: Clicker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.catchergriffin.clicker.tests
        DEVELOPMENT_TEAM: YZSL25MTN9
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: 1

schemes:
  Clicker:
    build:
      targets:
        Clicker: all
        ClickerTests: [test]
    run:
      config: Debug
      # Run from Xcode with the local StoreKit products instead of the App Store.
      storeKitConfiguration: Support/Clicker.storekit
      # Debug-only switches (see DebugPurchaseBackend.swift). Tick them in the
      # scheme editor: use the stand-in store instead of StoreKit, and run as
      # if it were 4 days from now (past the free trial).
      commandLineArguments:
        "-ClickerDebugStore YES": false
        "-ClickerDebugDaysAhead 4": false
    test:
      config: Debug
      targets:
        - ClickerTests
    archive:
      config: Release
